<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体脂秤数据 · Mi Fitness Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2c313c;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #4ea1ff;
    --orange: #e8a64a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; white-space: nowrap; }
  .toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 14px;
  }
  .toolbar h1 { align-self: center; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field-label { color: var(--muted); font-size: 12.5px; }
  .sel {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 13px;
    height: 30px; box-sizing: border-box;
  }
  .sel:focus { outline: none; border-color: var(--accent); }
  input[type=date].sel { color-scheme: dark; }
  button.sel { cursor: pointer; }
  /* Grafana 风格时间选择器 */
  .time-picker { position: relative; }
  .tp-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .tp-btn:hover { border-color: var(--accent); }
  .tp-caret { color: var(--muted); font-size: 10px; }
  .tp-popup {
    display: none; position: fixed;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; z-index: 350;
    min-width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .tp-popup.open { display: block; }
  .tp-section { margin-bottom: 14px; }
  .tp-section:last-child { margin-bottom: 0; }
  .tp-section-title { color: var(--muted); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .tp-quick { display: flex; gap: 6px; }
  .tp-quick button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 8px; font-size: 12.5px; cursor: pointer; text-align: center; flex: 1;
  }
  .tp-quick button:hover { border-color: var(--accent); }
  .tp-quick button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tp-custom { display: flex; flex-direction: row; align-items: center; gap: 6px; }
  .tp-dash { color: var(--muted); font-size: 12px; }
  .tp-custom input[type=date] {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 8px; font-size: 12.5px; color-scheme: dark; flex: 1; min-width: 0;
  }
  .tp-custom input[type=date]:focus { outline: none; border-color: var(--accent); }
  /* 外部 HTML tooltip,避免 canvas 内中文小字压扁 */
  #chartjs-tooltip {
    position: fixed; pointer-events: none;
    background: rgba(20,22,28,.95); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; z-index: 300;
    opacity: 0; transition: opacity .1s;
    transform: translate(-50%, calc(-100% - 12px));
    white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #chartjs-tooltip .tt-title { color: var(--muted); margin-bottom: 3px; font-size: 11px; }
  #chartjs-tooltip .tt-line b { color: var(--accent); }
  main { padding: 20px 32px 60px; }
  .group {
    margin-bottom: 28px;
  }
  .group h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px 10px;
    cursor: zoom-in; transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card .head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .head-right { display: flex; align-items: center; gap: 2px; }
  .card .name { font-size: 14px; font-weight: 600; }
  .card .unit { color: var(--muted); font-size: 12px; font-weight: 400; }
  .card .stats { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  .card .stats b { color: var(--text); font-weight: 600; }
  .card canvas { height: 150px !important; }
  .pin {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 1px 5px; border-radius: 5px; line-height: 1.2;
  }
  .pin:hover { color: var(--accent); border-color: var(--border); }
  .pin.active { color: var(--orange); }
  .ord {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 1px 5px; border-radius: 5px; line-height: 1.2;
  }
  .ord:hover { color: var(--accent); border-color: var(--border); }
  .footer { color: var(--muted); font-size: 12px; padding: 16px 32px; border-top: 1px solid var(--border); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  /* 置顶看板 */
  .dashboard { padding: 20px 32px 0; }
  .dashboard h2 { font-size: 15px; font-weight: 600; color: var(--orange); margin: 0 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .dashboard h2 .hint { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .dashboard .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 18px; }
  .card.dash canvas { height: 280px !important; }
  .card.dash { border-color: var(--orange); }

  /* 模态框 */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(3px);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 32px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 1000px;
    max-height: calc(100vh - 64px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal .head {
    display: flex; justify-content: flex-start; align-items: center;
    padding: 16px 20px; gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal .m-head-left { min-width: 0; }
  .modal .head .title { font-size: 16px; font-weight: 600; }
  .modal .head .title .unit { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .modal .head .stats { color: var(--muted); font-size: 12.5px; }
  .modal .head .stats b { color: var(--text); font-weight: 600; }
  .modal .close {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-left: 16px; flex-shrink: 0;
  }
  .modal .close:hover { border-color: var(--accent); color: var(--accent); }
  .modal-middle { margin-left: auto; }
  .modal-body { padding: 16px 20px 20px; overflow: auto; display: flex; flex-direction: column; height: 596px; max-height: calc(100vh - 184px); }
  .modal canvas { flex: 1 1 auto; min-height: 0; }
  #tm-text {
    width: 100%; flex: 1 1 auto; min-height: 0;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; line-height: 1.5; resize: none;
  }
  #tm-text:focus { outline: none; border-color: var(--accent); }
  .export-cols { flex-shrink: 0; }
  .modal-middle .sel { cursor: pointer; }
  .export-cols {
    display: grid; grid-template-columns: max-content 1fr; align-items: baseline; gap: 6px 14px;
    max-height: 220px; overflow: auto;
    padding: 10px; margin-bottom: 10px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  }
  .ec-group { display: contents; }
  .ec-labels { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .ec-group-title { color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  .ec-group-title:hover { color: var(--text); }
  .ec-group label { font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  .ec-group input { accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="toolbar">
    <h1>体脂秤身体数据</h1>
    <div class="field">
      <span class="field-label">文件</span>
      <button id="file-btn" class="sel" type="button" title="打开体脂秤 CSV">打开 CSV</button>
      <input type="file" id="file-input" accept=".csv" hidden>
    </div>
    <div class="field">
      <span class="field-label">用户</span>
      <select id="user-select" class="sel" title="切换用户档案"></select>
    </div>
    <div class="field">
      <span class="field-label">时间</span>
      <div id="main-tp"></div>
    </div>
    <div class="field">
      <span class="field-label">纵轴</span>
      <select id="yzero-select" class="sel" title="纵坐标起始点">
        <option value="auto">自动</option>
        <option value="pad">留白</option>
        <option value="zero">0</option>
      </select>
    </div>
    <div class="field">
      <button id="export-btn" class="sel" type="button" title="导出 Markdown 给 LLM 分析">导出 LLM</button>
    </div>
  </div>
</header>
<div class="dashboard" id="dashboard" style="display:none">
  <h2>★ 我的看板<span class="hint">点击卡片右上角星星置顶/取消,选择持久保存</span></h2>
  <div class="grid" id="dash-grid"></div>
</div>
<main id="main"></main>
<div class="footer" id="footer"></div>

<script>
const COLORS = {
  line: '#4ea1ff', grid: '#2a2f3a', text: '#8b93a1', point: '#4ea1ff',
  green: '#4caf94', orange: '#e8a64a', red: '#e85a5a'
};
let DATA = null;
let currentUser = null;    // 选中的用户 user_key,null 表示全部
let pinned = loadPinned();  // 置顶到看板的指标 key 有序数组
const charts = {};

// 体脂秤指标定义: key/中文名/单位/量纲分组/是否仅完整测量才有
const METRICS = [
  {key:"weight",    name:"体重",       unit:"kg",   group:"质量 (kg)",  completeOnly:false},
  {key:"swt",       name:"标准体重",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"bfm",       name:"脂肪量",     unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"ffm",       name:"去脂体重",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"slm",       name:"瘦体重",     unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"smm",       name:"骨骼肌量",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"bwm",       name:"体水分量",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"pm",        name:"蛋白量",     unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"bmc",       name:"骨盐量",     unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"mc",        name:"肌肉控制",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"wc",        name:"体重控制",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"fc",        name:"脂肪控制",   unit:"kg",   group:"质量 (kg)",  completeOnly:true},
  {key:"bfp",       name:"体脂率",     unit:"%",    group:"比率 (%)",   completeOnly:true},
  {key:"bwp",       name:"体水分率",   unit:"%",    group:"比率 (%)",   completeOnly:true},
  {key:"pp",        name:"蛋白率",     unit:"%",    group:"比率 (%)",   completeOnly:true},
  {key:"bmcp",      name:"骨盐量率",   unit:"%",    group:"比率 (%)",   completeOnly:true},
  {key:"bmi",       name:"BMI",        unit:"",     group:"指数与等级", completeOnly:true},
  {key:"vfl",       name:"内脏脂肪等级",unit:"",    group:"指数与等级", completeOnly:true},
  {key:"whr",       name:"腰臀比",     unit:"",     group:"指数与等级", completeOnly:true},
  {key:"sbc",       name:"身体得分",   unit:"",     group:"指数与等级", completeOnly:true},
  {key:"heartRate", name:"心率",       unit:"bpm",  group:"其他",       completeOnly:true},
  {key:"bmr",       name:"基础代谢率", unit:"kcal", group:"其他",       completeOnly:true},
  {key:"ma",        name:"身体年龄",   unit:"岁",   group:"其他",       completeOnly:true},
];

// ===== CSV 解析(纯前端,无后端) =====
function parseCsvLine(line) {
  const out = []; let cur = '', inQ = false;
  for (const c of line) {
    if (c === '"') inQ = !inQ;
    else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function toNum(v) {
  if (v == null || v === '' || v === 'null') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function formatDate(ts) {
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = parseCsvLine(lines[0]);
  const records = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i]) continue;
    const row = {};
    const cols = parseCsvLine(lines[i]);
    header.forEach((h, j) => row[h] = cols[j]);
    const ts = parseInt(row.time, 10);
    if (isNaN(ts)) continue;
    const weight = toNum(row.weight);
    if (!weight || weight <= 0) continue;  // 跳过无效称重
    const complete = (toNum(row.bfp) || 0) > 0;
    const rec = {
      date: formatDate(ts),
      user_key: `${row.account_id || ''}_${row.duid || ''}`,
      account_id: row.account_id || '', duid: row.duid || '', user_type: row.userType || '',
    };
    for (const m of METRICS) {
      const v = toNum(row[m.key]);
      rec[m.key] = (m.completeOnly && !complete) ? null : v;
    }
    records.push(rec);
  }
  records.sort((a, b) => a.date.localeCompare(b.date));
  return records;
}
function buildPayload(records) {
  const groups = {};
  for (const m of METRICS) {
    (groups[m.group] = groups[m.group] || []).push(
      {key: m.key, name: m.name, unit: m.unit, complete_only: m.completeOnly});
  }
  const users = {};
  for (const r of records) {
    const u = users[r.user_key] = users[r.user_key] || {
      user_key: r.user_key, duid: r.duid, user_type: r.user_type,
      count: 0, weight_sum: 0, weight_n: 0,
    };
    u.count++; if (r.weight) { u.weight_sum += r.weight; u.weight_n++; }
  }
  const userList = Object.values(users).map(u => {
    const mean = u.weight_n ? u.weight_sum / u.weight_n : 0;
    const role = u.user_type === '1' ? '主人' : '成员';
    return {
      user_key: u.user_key, weight_mean: Math.round(mean * 10) / 10, count: u.count,
      label: `成员 (槽位${u.duid}, ${role}, 均重${mean.toFixed(1)}kg, ${u.count}条)`,
    };
  }).sort((a, b) => a.label.localeCompare(b.label));
  return {
    generated_at: new Date().toLocaleString('zh-CN', {hour12: false}),
    groups, users: userList, records,
  };
}
// 文件句柄持久化(File System Access API,Chromium 系支持;其他浏览器降级为普通选文件)
const IDB = {
  get(k){return new Promise(res=>{const r=indexedDB.open('mifit',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{const t=r.result.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);};r.onerror=()=>res(null);});},
  set(k,v){return new Promise(res=>{const r=indexedDB.open('mifit',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{const tx=r.result.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();};r.onerror=()=>res();});},
  del(k){return new Promise(res=>{const r=indexedDB.open('mifit',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{const tx=r.result.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();};r.onerror=()=>res();});},
};
let lastHandle = null;
async function clearLastFile() {
  lastHandle = null;
  await IDB.del('fileHandle');
  localStorage.removeItem('mifit_file_name');
  document.getElementById('file-btn').textContent = '打开 CSV';
}
async function loadFromHandle(handle) {
  try {
    const file = await handle.getFile();  // 文件被删/移动会抛错
    loadFromFile(file, handle);
  } catch (e) {
    await clearLastFile();  // 路径失效,清空保存
  }
}
async function onFileBtnClick() {
  // 仅未加载时尝试恢复上次文件(需用户手势 requestPermission);已加载则直接换文件
  if (!DATA && lastHandle) {
    try {
      if (await lastHandle.requestPermission({mode:'read'}) === 'granted') {
        await loadFromHandle(lastHandle); return;
      }
    } catch(e) { await clearLastFile(); }
  }
  // 打开选择器选新文件(File System Access API,保存句柄)
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{description:'CSV', accept:{'text/csv':['.csv']}}]});
      await loadFromHandle(handle); return;
    } catch(e) { return; }  // 用户取消
  }
  document.getElementById('file-input').click();  // 降级:普通 input(无持久化)
}
function loadFromFile(file, handle) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      setData(buildPayload(parseCsv(reader.result)));
      document.getElementById('file-btn').textContent = file.name;
      if (handle) {
        lastHandle = handle;
        IDB.set('fileHandle', handle);
        localStorage.setItem('mifit_file_name', file.name);
      }
    } catch (e) {
      alert('解析失败: ' + e.message);
    }
  };
  reader.readAsText(file);
}
function setData(payload) {
  DATA = payload;
  currentUser = null;
  buildUserSelect();
  mainPicker.setRecordsBounds(DATA.records);
  render();
  document.getElementById('footer').textContent =
    `${DATA.records.length} 条记录 · ${DATA.users.length} 个用户档案 · 解析于 ${DATA.generated_at}`;
}

/* 公共时间选择器控件:底层只有自定义范围(start/end 日期),
   快捷范围只是快速预设 start/end 的快捷方式,统一走自定义入口。
   onChange(state) 在状态变化时回调,state={start,end}。 */
function createTimePicker(onChange) {
  const state = { start: '', end: '' };
  const el = document.createElement('div');
  el.className = 'time-picker';
  el.innerHTML = `
    <button class="tp-btn" type="button">
      <span class="tp-label">全部</span>
      <span class="tp-caret">▾</span>
    </button>
    <div class="tp-popup">
      <div class="tp-section">
        <div class="tp-section-title">快捷范围</div>
        <div class="tp-quick">
          <button type="button" data-range="all">全部</button>
          <button type="button" data-range="7">周</button>
          <button type="button" data-range="14">双周</button>
          <button type="button" data-range="30">月</button>
          <button type="button" data-range="90">季</button>
          <button type="button" data-range="365">年</button>
        </div>
      </div>
      <div class="tp-section">
        <div class="tp-section-title">自定义范围</div>
        <div class="tp-custom">
          <input type="date" class="tp-start">
          <span class="tp-dash">—</span>
          <input type="date" class="tp-end">
        </div>
      </div>
    </div>`;
  const btn = el.querySelector('.tp-btn');
  const popup = el.querySelector('.tp-popup');
  const labelEl = el.querySelector('.tp-label');
  const startInput = el.querySelector('.tp-start');
  const endInput = el.querySelector('.tp-end');
  const quickBtns = el.querySelectorAll('.tp-quick button');
  let bounds = null;  // 数据日期范围 {lo, hi}

  function fmtDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  // 快捷范围 -> 具体日期区间 {start, end}
  function rangeToDates(range) {
    if (!bounds) return null;
    if (range === 'all') return { start: bounds.lo, end: bounds.hi };
    const days = parseInt(range, 10);
    const end = new Date(bounds.hi + 'T00:00:00');
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: fmtDate(start), end: bounds.hi };
  }
  function applyRange(d) {
    state.start = d.start; state.end = d.end;
    startInput.value = d.start; endInput.value = d.end;
    emit();
  }

  function updateLabel() {
    if (bounds && state.start === bounds.lo && state.end === bounds.hi) {
      labelEl.textContent = '全部';
    } else if (state.start || state.end) {
      const s = state.start ? state.start.slice(5) : '…';
      const e = state.end ? state.end.slice(5) : '…';
      labelEl.textContent = `${s} ~ ${e}`;
    } else {
      labelEl.textContent = '全部';
    }
  }
  // 当 start/end 恰好等于某快捷范围时高亮该按钮
  function updateQuickActive() {
    quickBtns.forEach(b => {
      const d = rangeToDates(b.dataset.range);
      b.classList.toggle('active', !!(d && d.start === state.start && d.end === state.end));
    });
  }
  function emit() { updateLabel(); updateQuickActive(); if (onChange) onChange(state); }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    popup.classList.toggle('open');
    if (popup.classList.contains('open')) positionPopup(popup, btn);
  });
  document.addEventListener('click', (e) => {
    if (!popup.contains(e.target) && !btn.contains(e.target)) popup.classList.remove('open');
  });
  // 快捷范围:仅作为快速预设自定义范围的快捷方式
  quickBtns.forEach(b => b.addEventListener('click', () => {
    const d = rangeToDates(b.dataset.range);
    if (!d) return;
    popup.classList.remove('open');
    applyRange(d);
  }));
  function onDateChange() {
    state.start = startInput.value;
    state.end = endInput.value;
    emit();
  }
  startInput.addEventListener('change', onDateChange);
  endInput.addEventListener('change', onDateChange);

  updateLabel(); updateQuickActive();

  return {
    el,
    getState: () => ({ start: state.start, end: state.end }),
    setRecordsBounds: (records) => {
      if (!records || !records.length) return;
      const lo = records[0].date.slice(0, 10);
      const hi = records[records.length - 1].date.slice(0, 10);
      bounds = { lo, hi };
      startInput.min = lo; startInput.max = hi;
      endInput.min = lo; endInput.max = hi;
      // 默认观察全部范围
      state.start = lo; state.end = hi;
      startInput.value = lo; endInput.value = hi;
      updateLabel(); updateQuickActive();
    },
    close: () => popup.classList.remove('open'),
  };
}

// 按天聚合所有指标,按用户/量纲分表,附字段字典
function aggregateAllByDay(records) {
  const byDay = {};
  for (const r of records) {
    const dk = r.date.slice(0, 10);
    const d = byDay[dk] = byDay[dk] || {sum: {}, n: {}};
    for (const m of METRICS) {
      const v = r[m.key];
      if (v != null) {
        d.sum[m.key] = (d.sum[m.key] || 0) + v;
        d.n[m.key] = (d.n[m.key] || 0) + 1;
      }
    }
  }
  return Object.keys(byDay).sort().map(dk => {
    const d = byDay[dk], row = {date: dk};
    for (const m of METRICS) row[m.key] = d.n[m.key] ? d.sum[m.key] / d.n[m.key] : null;
    return row;
  });
}

function regenerateExport() {
  const records = filteredRecords();
  if (!records.length) { document.getElementById('tm-text').value = '当前筛选无数据'; return; }
  const sel = new Set([...document.querySelectorAll('#ec-box input:checked')].map(cb => cb.dataset.key));
  const selMetrics = METRICS.filter(m => sel.has(m.key));
  const byUser = {};
  for (const r of records) (byUser[r.user_key] = byUser[r.user_key] || []).push(r);

  let md = '# 体脂秤数据分析\n\n';
  md += `- 数据范围: ${records[0].date.slice(0,10)} ~ ${records[records.length-1].date.slice(0,10)}\n`;
  md += `- 用户数: ${Object.keys(byUser).length}  ·  原始记录: ${records.length} 条\n`;
  md += `- 数据按天聚合(同一天多次测量取日均),无测量的天该格为空\n\n`;

  md += '## 字段说明\n\n| key | 名称 | 单位 | 分组 |\n|---|---|---|---|\n';
  for (const m of selMetrics) md += `| ${m.key} | ${m.name} | ${m.unit || '-'} | ${m.group} |\n`;
  md += '\n';

  for (const [uk, recs] of Object.entries(byUser)) {
    const u = DATA.users.find(x => x.user_key === uk);
    md += `## ${u ? u.label : uk}\n\n`;
    const daily = aggregateAllByDay(recs);
    md += `| 日期 |${selMetrics.map(m => m.name).join('|')}|\n|---|${selMetrics.map(() => '---').join('|')}|\n`;
    for (const row of daily) {
      md += `| ${row.date} |${selMetrics.map(m => row[m.key] == null ? '-' : fmt(row[m.key])).join('|')}|\n`;
    }
    md += '\n';
  }
  document.getElementById('tm-text').value = md;
}

  if (end) recs = recs.filter(r => r.date.slice(0, 10) <= end);

}

function buildCard(metric, records, opts = {}) {
  const card = document.createElement('div');
  card.className = 'card' + (opts.pinned ? ' dash' : '');

  const {pairs, stats} = computeSeries(metric, records);
  const isPinned = pinned.includes(metric.key);

  card.innerHTML = `
    <div class="head">
      <span class="name">${metric.name}<span class="unit">${metric.unit ? ' ' + metric.unit : ''}</span></span>
      <div class="head-right">
        ${opts.pinned ? `
          <button class="ord" data-dir="-1" title="上移">↑</button>
          <button class="ord" data-dir="1" title="下移">↓</button>` : ''}
        <button class="pin${isPinned ? ' active' : ''}" title="${isPinned ? '取消置顶' : '置顶到看板'}">${isPinned ? '★' : '☆'}</button>
      </div>
    </div>
    <div class="stats">${statsHtml(stats)}</div>
    <canvas></canvas>`;
  const ctx = card.querySelector('canvas');
  // 看板卡片与分组卡片用不同 key,避免同指标两个 Chart 实例冲突
  const chartKey = (opts.pinned ? 'dash:' : 'grp:') + metric.key;
  charts[chartKey] = makeChart(ctx, metric, pairs, false);

  card.querySelector('.pin').addEventListener('click', (e) => {
    e.stopPropagation();
    togglePinned(metric.key);
  });
  card.querySelectorAll('.ord').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    movePinned(metric.key, parseInt(b.dataset.dir, 10));
  }));
  card.addEventListener('click', () => openModal(metric));
  return card;
}

function computeStats(pairs) {
  const valid = pairs.map(p => p.v).filter(v => v !== null && v !== undefined);
  const last = valid.length ? valid[valid.length - 1] : null;
  const min = valid.length ? Math.min(...valid) : null;
  const max = valid.length ? Math.max(...valid) : null;
  const delta = (valid.length >= 2) ? (last - valid[0]) : null;
  const deltaTxt = (fmt) => delta === null ? '' :
    ` · 变化 <b style="color:${delta>0?COLORS.red:delta<0?COLORS.green:COLORS.text}">${delta>0?'+':''}${fmt(delta)}</b>`;
  return { last, min, max, delta, deltaTxt, count: valid.length };
}
// 统一 series 计算:按天聚合 + 统计摘要,小图/看板/大图共用
function computeSeries(metric, records) {
  const pairs = aggregateByDay(metric, records);
  return { pairs, stats: computeStats(pairs) };
}

// 按天聚合:同一天多次测量取平均。横坐标保留完整日期范围内每一天,
// 无测量的天 v=null(不绘制数据点,折线 spanGaps 跨过)。
function aggregateByDay(metric, records) {
  const byDay = new Map();
  records.forEach(r => {
    const v = r[metric.key];
    if (v === null || v === undefined) return;
    const dayKey = r.date.slice(0, 10);
    let e = byDay.get(dayKey);
    if (!e) { e = { sum: 0, n: 0 }; byDay.set(dayKey, e); }
    e.sum += v; e.n++;
  });
  return buildAllDays(records).map(dk => {
    const e = byDay.get(dk);
    return { d: dk.slice(5), v: e ? e.sum / e.n : null };
  });
}

// 生成从最早到最晚测量日的完整日期列表 (YYYY-MM-DD),逐日填充
function buildAllDays(records) {
  if (!records.length) return [];
  const start = records[0].date.slice(0, 10);
  const end = records[records.length - 1].date.slice(0, 10);
  const days = [];
  const cur = new Date(start + 'T00:00:00');
  const endD = new Date(end + 'T00:00:00');
  while (cur <= endD) {
    const y = cur.getFullYear();
    const m = String(cur.getMonth() + 1).padStart(2, '0');
    const d = String(cur.getDate()).padStart(2, '0');
    days.push(`${y}-${m}-${d}`);
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

function fmt(v) {
  if (v === null || v === undefined) return '-';
  return Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(Math.abs(v) < 10 ? 2 : 1);
}

function makeChart(ctx, metric, pairs, large) {
  const chartLabels = pairs.map(p => p.d);
  const values = pairs.map(p => p.v);
  const validVals = values.filter(v => v !== null && v !== undefined);
  const vmin = validVals.length ? Math.min(...validVals) : 0;
  const vmax = validVals.length ? Math.max(...validVals) : 0;
  const vrange = vmax - vmin;

  const color = COLORS.line;

  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: chartLabels,
      datasets: [{
        data: values,
        borderColor: color,
        backgroundColor: color + '22',
        borderWidth: 2,
        pointRadius: large ? 4 : 2.5,
        pointHoverRadius: large ? 7 : 5,
        pointBackgroundColor: color,
        tension: 0.3,
        fill: true,
        spanGaps: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      hover: { animationDuration: 0 },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: false,  // 改用外部 HTML tooltip,避免 canvas 内中文小字压扁
          external: externalTooltipHandler,
          callbacks: {
            label: (c) => {
              const v = c.parsed.y;
              return v === null ? '无数据' : `${fmt(v)}${metric.unit ? ' ' + metric.unit : ''}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: COLORS.text, maxTicksLimit: large ? 12 : 6, font: { size: large ? 11 : 10 }, maxRotation: 45, autoSkip: true },
          grid: { color: COLORS.grid }
        },
        y: {
          beginAtZero: yMode === 'zero',
          suggestedMin: (yMode === 'pad' && vrange > 0) ? vmin - vrange * 0.1 : undefined,
          suggestedMax: (yMode === 'pad' && vrange > 0) ? vmax + vrange * 0.1 : undefined,
          ticks: { color: COLORS.text, font: { size: large ? 11 : 10 },
                   callback: (v) => fmt(v) },
          grid: { color: COLORS.grid }
        }
      },
      interaction: { mode: 'index', intersect: false }
    }
  });
}

// 外部 HTML tooltip:用 DOM 渲染,字体清晰不变形
const tooltipEl = document.createElement('div');
tooltipEl.id = 'chartjs-tooltip';
document.body.appendChild(tooltipEl);

function externalTooltipHandler(context) {
  const { chart, tooltip } = context;
  if (!tooltip || tooltip.opacity === 0) { tooltipEl.style.opacity = 0; return; }
  if (tooltip.body) {
    const title = tooltip.title || [];
    let html = '';
    if (title.length) html += `<div class="tt-title">${title[0]}</div>`;
    tooltip.body.forEach(b => {
      b.lines.forEach(l => { html += `<div class="tt-line"><b>${l}</b></div>`; });
    });
    tooltipEl.innerHTML = html;
  }
  const rect = chart.canvas.getBoundingClientRect();
  let left = rect.left + tooltip.caretX;
  // 防止超出视口右边
  const w = tooltipEl.offsetWidth || 120;
  left = Math.min(left, window.innerWidth - w / 2 - 8);
  left = Math.max(left, w / 2 + 8);
  tooltipEl.style.opacity = 1;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = rect.top + tooltip.caretY + 'px';
}

/* ===== 公共 Modal 组件 =====
   统一 overlay 结构 + close 按钮 + 遮罩点击 + Esc 关闭。
   title/stats/middle/body 由调用方配置。 */
function createModal({title = '', stats = '', middle = false} = {}) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="head">
        <div class="m-head-left">
          <div class="title"><span class="tname">${title}</span><span class="unit"></span></div>
          <div class="stats">${stats}</div>
        </div>
        <div class="modal-middle"></div>
        <button class="close" type="button" title="关闭 (Esc)">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.classList.remove('open');
  overlay.querySelector('.close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  return {
    el: overlay,
    body: overlay.querySelector('.modal-body'),
    titleEl: overlay.querySelector('.title'),
    tnameEl: overlay.querySelector('.tname'),
    unitEl: overlay.querySelector('.unit'),
    statsEl: overlay.querySelector('.stats'),
    middleEl: overlay.querySelector('.modal-middle'),
    isOpen: () => overlay.classList.contains('open'),
    open: () => overlay.classList.add('open'),
    close,
  };
}

// 所有 modal 实例(统一 Esc 关闭)
const modals = [];
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') modals.forEach(m => { if (m.isOpen()) m.close(); });
});

/* ===== 大图 modal ===== */
const chartModal = createModal({middle: true});
const modalTimeField = document.createElement('div');
modalTimeField.className = 'field';
modalTimeField.innerHTML = '<span class="field-label">时间</span>';
modalTimeField.appendChild(modalPicker.el);
chartModal.middleEl.appendChild(modalTimeField);
chartModal.body.innerHTML = '<canvas></canvas>';
const modalCanvas = chartModal.body.querySelector('canvas');
let modalChart = null, modalMetric = null, modalRecords = [];

function openModal(metric) {
  modalMetric = metric;
  modalRecords = (currentUser !== null)
    ? DATA.records.filter(r => r.user_key === currentUser)
    : DATA.records;
  modalPicker.setRecordsBounds(modalRecords);
  chartModal.tnameEl.textContent = metric.name;
  chartModal.unitEl.textContent = metric.unit ? `(${metric.unit})` : '';
  if (modalChart) { modalChart.destroy(); modalChart = null; }
  chartModal.open();
  requestAnimationFrame(drawModal);
}
function drawModal() {
  const s = modalPicker.getState();
  const recs = filterByRange(modalRecords, s.start, s.end);
  const {pairs, stats} = computeSeries(modalMetric, recs);
  chartModal.statsEl.innerHTML = statsHtml(stats, true);
  if (modalChart) modalChart.destroy();
  modalChart = makeChart(modalCanvas, modalMetric, pairs, true);
}
function closeModal() {
  chartModal.close();
  modalPicker.close();
  if (modalChart) { modalChart.destroy(); modalChart = null; }
}

/* ===== 文本 modal(导出 LLM) ===== */
const textModal = createModal({title: '导出给 LLM', stats: '勾选要导出的列,Markdown 可直接复制粘贴到 LLM 对话'});
textModal.body.innerHTML = `
  <div class="export-cols" id="ec-box"></div>
  <textarea id="tm-text" readonly></textarea>`;
textModal.middleEl.innerHTML = '<button class="sel" id="tm-copy" type="button" title="复制全部 Markdown">复制全部</button>';
document.getElementById('tm-copy').addEventListener('click', async (e) => {
  const t = document.getElementById('tm-text');
  try { await navigator.clipboard.writeText(t.value); }
  catch (_) { t.select(); document.execCommand('copy'); }
  const btn = e.currentTarget, orig = btn.textContent;
  btn.textContent = '已复制 ✓';
  setTimeout(() => btn.textContent = orig, 1500);
});

modals.push(chartModal, textModal);

init();
</script>
</body>
